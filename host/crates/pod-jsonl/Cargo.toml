[package]
name = "pod-jsonl"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# The whole dependency set, deliberately: this crate exists so a binary with no
# business linking a wake-word runtime or an HTTP client can still emit the
# workspace's event lines.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
