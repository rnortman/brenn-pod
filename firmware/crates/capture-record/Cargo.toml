[package]
name = "capture-record"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# The capture record format in both directions: header metadata, the writer,
# and the reader with its tail verdicts. Its dependency closure is held to an
# exact allow-list by tests/dep_graph.rs, so a reader of recordings never links
# a native library or another brenn-pod crate with a build script.

[dependencies]
stamped-log = { path = "../stamped-log" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
