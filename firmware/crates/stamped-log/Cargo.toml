[package]
name = "stamped-log"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# The container shared by the host's frame log and the Linux pod's capture
# record: a magic-tagged header with opaque metadata, then length-prefixed
# records each carrying a u64 stamp. std only, so either format's reader can
# depend on it without inheriting anything.

