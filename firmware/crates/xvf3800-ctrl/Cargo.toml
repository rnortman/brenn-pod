[package]
name = "xvf3800-ctrl"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Transport-independent XVF3800 control protocol: resource/command IDs, status
# semantics, retry policy, the `ControlTransport` seam, and the pure decoders.
# The command map is a property of the XVF3800 firmware and carries across I2C
# and USB alike, so both the ESP32 (I2C) and Linux (USB) transports drive the
# same retry logic from here.
#
# Deliberately dependency-free and no_std so the ESP32 firmware links it without
# pulling anything new in, and so the whole protocol is host-testable.

[dependencies]
