# reachy-motiond.example.toml — every key the daemon reads.
#
# Copy it, change the values that describe your unit and your bus, and push it to
# the device with `make reachy-motiond-config`. Every key that has a default is
# written here at that default, so deleting one changes nothing and the file
# doubles as the documentation of what omitting it means.
#
# Five keys have no default and must be given: motion_config, pod and channel
# below, and server_url and token_file in [bridge]. A daemon that guessed at any
# of them would move a machine on somebody else's word, or reach a bus nobody
# named. Everything else here — the three periods below, the whole
# [bridge.reconnect] block — is written at its default.
#
# What is NOT here is the machine: the servo bus, the crank datum, the envelope
# and the tick rates all live in the bench configuration named below, which is
# the same file the operator tool reads on this unit. The move durations are the
# one exception, and they are optional: how briskly the head acknowledges a wake
# word is presence policy, tunable here with `make reachy-motiond-config` and a
# restart, while the machine's own truth stays in the bench file.

# The bench configuration for this unit. The daemon resolves it with the same
# function the operator tool does, so the two cannot describe different
# platforms. It must carry a crank datum a human measured and wrote in — that is
# calibration, not a gate, and nothing else about this file stands between the
# daemon and a machine that answers.
motion_config = "/var/lib/brenn-app/reachy-bench.toml"

# The identity whose motion scripts this daemon obeys. Bodies addressed to any
# other pod are reported and dropped: the channel is not assumed to carry one
# machine's traffic.
pod = "reachy00"

# The channel the scripts arrive on. Both ends have to name the same one, and
# the scripter's grant on the bus has to allow it.
channel = "brenn:reachy.motion"

# The longest the motion loop watches the machine before it looks at the
# schedule again. A ceiling, not a period: a dwell is cut short by the running
# script's next step or by its expiry, so a step at an arbitrary offset lands on
# the script's own clock rather than at the next multiple of this. What this
# actually bounds is the reaction latency to a script arriving, and the cadence
# at which a machine with nothing scheduled is monitored for a fault.
#
# There is no separate timeout here: every script carries its own, which is what
# bounds how long the head can stay up when the scripter dies mid-conversation.
hold_dwell_ms = 200

# How often the resting watch sweeps a limp machine: nine position reads, plus
# the supply and the error bits on the slower cadence the bench configuration
# sets. It bounds how stale the pose an engage plans from can be when a hand has
# moved the head, and how long a script asking for the head up waits before
# anything happens. Must be at least 1.
rest_poll_ms = 100

# How long the head holds at stow, still torqued, before torque comes off. The
# quick-follow-up window: a wake inside it retargets the head up with no release
# and no engage in between. Zero is lawful and means let go the moment the head
# is folded — stowed with torque held is this machine's only pinch hazard, so
# nothing here should be longer than the follow-up it buys. Refused above 60000
# for that reason: a seconds-versus-milliseconds slip here holds the pinch
# posture for minutes after every turn.
rest_delay_ms = 5000

# The move durations, in seconds, each optional and each overriding the bench
# configuration's value for this daemon alone. Omit one and the bench file
# governs it; omit all of them and this daemon moves at exactly the pace the
# operator tool does.
#
# They come in two mechanical groups. The head group is the head pose and the
# body yaw, which the six legs follow through the inverse kinematics; the
# antennas are independent of it and sweep much further, which is why they have a
# clock of their own — a lift tuned to be quick has no business being floored by
# an antenna arc.
#
# The antennas take three keys, not one: a shared clock and one per side. The
# two tips cross inboard of the head, and a pair sweeping mirror-symmetrically
# arrives at that crossing together — which is how two antenna servos latched
# their overloads on the bench. Two clocks part them. Setting these keys is not
# what makes the pair safe: whatever they resolve to, the move resolver measures
# the pair at the crossing and lengthens the later side until the tips clear
# each other, saying so in the capture. What they buy is choosing the pace at
# which that happens rather than being handed it. A side's own key wins over the
# shared one; the shared one wins over the head group's clock.
#
# FLOORS. These durations are a nominal policy rather than a promise: a move
# whose span will not fit inside the per-tick step bounds at the duration named
# here runs on a clock stretched to fit, and says so — a `motion_clock_stretched`
# line in the capture carrying what was asked for and what it ran on. The path is
# unchanged; it is traversed more slowly. So a value set too low costs a slower
# move and a line of output, never a move that stops partway and a head that
# settles limp.
#
# What the floors are still for is knowing when a stretch is about to be the
# ordinary case rather than the exception — and for this daemon that case is a
# duration written here that is under the floor for the span it asks for, because
# nothing else it commands reaches one. Where these numbers come from — the
# closed form, what the effective clock carries on top of it, and why — is stated
# once, in the FLOORS comment of `crates/reachy-bench/reachy-bench.example.toml`
# in the sibling brenn-reachy checkout.
# At the bounds and tick rate that file ships:
#
#   head group   0.36 s for the stow-to-neutral span. No closed form (the legs
#                move through the IK); derived by walking the planned path and
#                pinned by a reachy-motion unit test, so it moves only when the
#                geometry, the tick rate or `max_step_legs_rad` does.
#   body yaw     0.26 s from the 60-degree cap the bench file ships, and 0.52 s
#                for the widest sweep a command can lawfully ask — cap to cap.
#                Where the machine physically stands is not capped, though: the
#                startup fold out of a body a hand spun to the half turn while it
#                lay limp needs 0.79 s of yaw. `stow_duration_s = 2.0` carries
#                that outright, and a fold configured quicker than it is what the
#                stretch would lengthen back.
#   antennas     0.19 s for the 3.23 rad stow-to-neutral arc, 0.28 s to re-stow
#                an antenna left just inboard of sideways, and 0.36 s for the
#                widest sweep the bench command can ask for. The daemon only ever
#                commands the first two.
#
# The two head-group lines are commented out — that is, the daemon runs on
# whatever the machine's own bench file says, and the values below are that
# file's, restated so uncommenting one changes nothing until you edit it. The
# raise is the gesture that was measured on the machine: 0.8 s, arriving with
# no settling period after the last goal went out. Tune either a step at a time
# and watch the tracking error in the capture; a value under the floor is not a
# hazard to hand-check, it is a stretch line in the capture saying the clock
# this file asked for was not the one the move ran on. The antenna clock needs
# no such trial: its floor is closed-form, and 1.5 s clears the 0.28 s worst
# case the daemon can reach with real margin.
# up_duration_s = 0.8
# stow_duration_s = 2.0
antenna_duration_s = 1.5
# The two per-side clocks are commented out — that is, both antennas ride the
# shared clock above and the resolver parts them at the crossing. Uncomment them
# to choose the stagger yourself; the side you give the longer clock is the one
# that reaches the crossing second.
# antenna_duration_right_s = 1.5
# antenna_duration_left_s = 1.5

# The bus attachment. The same table every binary here that attaches to the bus
# writes, nested whole.
[bridge]
# The remote route, path included. The bridge appends nothing: which host it
# reaches the reverse proxy on, and under which slug, is operator topology.
server_url = "wss://brenn.example.net/remote/reachy-motiond/ws"
# The bearer token, mode 0600 and owned by the account the daemon runs as — a
# group- or world-readable token file is a startup refusal. `make
# reachy-motiond-token` installs it that way.
token_file = "/var/lib/brenn-app/motiond-token"
# A free-form build identifier put on the handshake, for the server's logs;
# never parsed by either end. Omitted here rather than written out: it defaults
# to the bridge library's own name and version, and a literal copy of that here
# would be a version number nothing updates.
# ident = "reachy-motiond"

# Reconnect and liveness timings, all at the bridge's defaults — sized for an
# appliance on a home LAN.
[bridge.reconnect]
# Delay before the first attempt after a drop, jittered so a fleet restarting
# together does not re-dial in lockstep, doubling up to the ceiling below.
initial_backoff_ms = 500
max_backoff_ms = 30000
# How long one connect-plus-handshake may take before the attempt is abandoned.
connect_timeout_ms = 15000
# Multiples of the server's advertised heartbeat interval of inbound silence
# that mark the attachment dead.
liveness_multiplier = 3
# How many consecutive futile attachments end the process — an attachment is
# futile when this end sent something and the peer answered nothing before the
# socket died. The daemon stows, releases and exits nonzero when they run out.
max_futile_attachments = 3
