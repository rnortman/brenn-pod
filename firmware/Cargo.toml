[workspace]
members = [
    "devices/reachy-motiond",
    "devices/reachy-pod",
    "devices/respeaker-pod",
    "crates/audio-pipeline",
    "crates/brenn-bridge",
    "crates/device-protocol",
    "crates/build-id",
    "crates/hil-host",
    "crates/motion-proto",
    "crates/pod-jsonl",
    "crates/pod-secrets",
    "crates/pod-streamer",
    "crates/pod-transport",
    "crates/podctl",
    "crates/psk-link",
    "crates/truncfmt",
    "crates/wifi-diag",
    "crates/wifi-reconnect",
    "crates/xvf3800-ctrl",
]
# default-members lists only host-buildable crates so no-flag `cargo build`/`cargo test`
# runs host builds/tests without building the device crate or requiring espup.
# The device crate stays out of default-members permanently; build it from its own
# directory (`cd devices/respeaker-pod && cargo build --release`) where the crate-scoped
# rust-toolchain.toml and .cargo/config.toml select the esp channel and Xtensa target.
# hil-host is a workspace member but NOT a default member (pulls serialport; keep it
# out of the default lane so `make check-host` stays light). psk-link is out for the same
# reason (openssl, which needs libssl-dev); `make check-host` covers it via --workspace.
# reachy-pod is out for the same reason too (rusb → libusb-1.0); it is a Linux binary
# built for the Pi in a container, and its host-triple unit tests run under --workspace.
# brenn-bridge is out for the same reason again (native-tls → openssl); its own tests
# and its consumers' run under --workspace. reachy-motiond is out because it is one of
# those consumers, and because it is another Pi binary built in a container. pod-jsonl
# and pod-secrets are in: they are small, pure-Rust, and everything else here can depend
# on them freely.
default-members = ["crates/audio-pipeline", "crates/device-protocol", "crates/build-id", "crates/motion-proto", "crates/pod-jsonl", "crates/pod-secrets", "crates/pod-streamer", "crates/truncfmt", "crates/wifi-diag", "crates/wifi-reconnect", "crates/xvf3800-ctrl"]
resolver = "2"

[workspace.package]
# Source of truth for the edition across every crate in this workspace; each member
# manifest says `edition.workspace = true`. Must agree with host/Cargo.toml and the
# rustfmt edition flag in .claude/hooks/format.sh — scripts/check-edition.sh enforces it.
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
esp-idf-svc = { version = "0.52.1" }
log = "0.4"

# Build the motion crates out of the clone beside this repository instead of the
# revision the daemon's manifest pins.
#
# Not a convenience: the daemon reads `Commissioned::fresh()` to decide whether
# it may enable torque, and it refuses an engage rather than parking when a
# position sweep fails. That refusal is only correct against a library whose
# failed sweep clears the freshness flag, which the pinned revision's does not —
# built against it, a wake after a failed sweep would pin nine goal registers at
# a posture measured before the outage and then enable torque. So while this
# table stands, every build of this workspace is the coherent pair, and a
# machine without the clone fails to resolve rather than compiling that hazard.
#
# The pins move at the ship gate, once the motion clone is pushed: bump the three
# `rev =` values in devices/reachy-motiond/Cargo.toml to the pushed revision,
# comment this table out, regenerate Cargo.lock. Public CI cannot see the clone,
# so it stays red until that runs.
[patch."https://github.com/rnortman/brenn-reachy"]
reachy-bench = { path = "../../brenn-reachy/crates/reachy-bench" }
reachy-bus = { path = "../../brenn-reachy/crates/reachy-bus" }
reachy-motion = { path = "../../brenn-reachy/crates/reachy-motion" }

[profile.release]
opt-level = "s"
